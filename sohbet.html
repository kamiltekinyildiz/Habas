<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HABAŞ - Sohbet & Vardiya</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-header { background: #1a73e8; color: white; padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .top-header h2 { font-size: 17px; font-weight: bold; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .back-btn, .notif-btn { background: rgba(255,255,255,0.2); color: white; padding: 6px 10px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; border: none; cursor: pointer; }
        #chat-container { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #e5ddd5; }
        .message-card { background: white; padding: 10px 14px; border-radius: 8px; max-width: 85%; box-shadow: 0 1px 2px rgba(0,0,0,0.1); word-break: break-word; align-self: flex-start; }
        .message-card.my-message { background: #dcf8c6; align-self: flex-end; }
        .msg-user { font-size: 12px; font-weight: bold; color: #1a73e8; margin-bottom: 3px; }
        .msg-info { font-size: 10px; color: #888; margin-bottom: 4px; }
        .msg-text { font-size: 15px; color: #333; margin-bottom: 5px; }
        .msg-img { max-width: 100%; border-radius: 6px; margin-top: 5px; display: block; }
        .msg-time { font-size: 10px; color: #777; margin-top: 4px; float: right; }
        .msg-delete { font-size: 11px; color: #dc3545; background: none; border: none; cursor: pointer; font-weight: bold; margin-right: 10px; display: none; }
        .chat-input-bar { background: white; padding: 10px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
        .chat-input-bar input[type="text"] { flex-grow: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; outline: none; }
        .file-upload-btn, #send-btn { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
        .file-upload-btn { background: #e0e0e0; color: #333; }
    </style>
</head>
<body>
    <div class="top-header">
        <h2>💬 Vardiya Panosu</h2>
        <div class="header-actions">
            <button class="notif-btn" id="notif-perm-btn" onclick="requestNotification()">🔔 Bildirim Aç</button>
            <a href="index.html" class="back-btn">🏠 Ana Menü</a>
        </div>
    </div>
    <div id="chat-container"></div>
    <div class="chat-input-bar">
        <input type="file" id="file-input" accept="image/*" style="display: none;">
        <button class="file-upload-btn" id="attach-btn">📷</button>
        <input type="text" id="message-input" placeholder="Mesaj yazın..." autocomplete="off">
        <button id="send-btn">➤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyDrWXMQRR74_B5faBNijiT1zXfYHA-MWtM", authDomain: "habas-navigasyon.firebaseapp.com", databaseURL: "https://habas-navigasyon-default-rtdb.europe-west1.firebasedatabase.app", projectId: "habas-navigasyon", storageBucket: "habas-navigasyon.firebasestorage.app", messagingSenderId: "1096725065152", appId: "1:1096725065152:web:f30a0e53b7adb2683f2c25" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const savedData = localStorage.getItem('habas_user_data');
        if(!savedData) { window.location.href = 'index.html'; }
        const myUser = JSON.parse(savedData);

        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const chatRef = ref(db, 'habas_chat_room');
        const auditRef = ref(db, 'habas_audit_logs');

        // Bildirim İzni İsteme Fonksiyonu (Butona bağlanmıştır)
        window.requestNotification = function() {
            if (!("Notification" in window)) {
                alert("Bu tarayıcı bildirimleri desteklemiyor.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    alert("Bildirimler başarıyla aktif edildi!");
                    document.getElementById('notif-perm-btn').style.display = 'none';
                } else {
                    alert("Bildirim izni reddedildi.");
                }
            });
        };

        // Sayfa açıldığında izin verilmişse butonu gizle
        if ("Notification" in window && Notification.permission === "granted") {
            document.getElementById('notif-perm-btn').style.display = 'none';
        }

        function sendData(text, imageBase64 = null) {
            push(chatRef, {
                sender: myUser.name,
                sicil: myUser.sicil,
                firma: myUser.firma,
                text: text,
                image: imageBase64,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });
        }

        document.getElementById('send-btn').addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) { sendData(text); messageInput.value = ''; }
        });
        document.getElementById('attach-btn').addEventListener('click', () => document.getElementById('file-input').click());
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => sendData("📷 Görsel:", ev.target.result);
                reader.readAsDataURL(file);
            }
        });

        window.deleteMessage = function(id, msgText, msgSender) {
            if (confirm("Bu mesajı silmek istiyor musunuz?")) {
                push(auditRef, {
                    actionBy: myUser.name,
                    actionSicil: myUser.sicil,
                    deletedMsg: msgText,
                    originalSender: msgSender,
                    time: new Date().toLocaleString()
                }).then(() => {
                    remove(ref(db, 'habas_chat_room/' + id));
                });
            }
        };

        let isFirstLoad = true;
        let lastMessageCount = 0;

        onValue(chatRef, (snapshot) => {
            chatContainer.innerHTML = '';
            const data = snapshot.val();
            if (data) {
                const messages = Object.entries(data);
                
                messages.forEach(([id, msg]) => {
                    const card = document.createElement('div');
                    card.classList.add('message-card');
                    if (msg.sicil === myUser.sicil) card.classList.add('my-header-card') || card.classList.add('my-message');

                    let contentHtml = `<div class="msg-user">${msg.sender}</div>`;
                    contentHtml += `<div class="msg-info">Firma: ${msg.firma || '-'} | Sicil: ${msg.sicil || '-'}</div>`;
                    if (msg.text) contentHtml += `<div class="msg-text">${msg.text}</div>`;
                    if (msg.image) contentHtml += `<img src="${msg.image}" class="msg-img">`;
                    
                    let deleteBtnHtml = "";
                    if(msg.sicil === myUser.sicil || myUser.sicil === "253525") {
                        deleteBtnHtml = `<button class="msg-delete" style="display:inline-block;" onclick="window.deleteMessage('${id}', '${msg.text}', '${msg.sender}')">Sil</button>`;
                    }

                    contentHtml += `<div>${deleteBtnHtml}<span class="msg-time">${msg.time || ''}</span></div>`;
                    card.innerHTML = contentHtml;
                    chatContainer.appendChild(card);
                });
                
                chatContainer.scrollTop = chatContainer.scrollHeight;

                // Yeni mesaj geldiğinde bildirim atma kontrolü
                if (!isFirstLoad && messages.length > lastMessageCount) {
                    const lastMsg = messages[messages.length - 1][1];
                    // Eğer mesajı gönderen sen değilsen ve bildirim izni verilmişse
                    if (lastMsg.sicil !== myUser.sicil && "Notification" in window && Notification.permission === "granted") {
                        new Notification("HABAŞ Vardiya Panosu: " + lastMsg.sender, {
                            body: lastMsg.text,
                            icon: "https://cdn-icons-png.flaticon.com/512/3233/3233483.png"
                        });
                    }
                }
                lastMessageCount = messages.length;
            }
            isFirstLoad = false;
        });
    </script>
</body>
</html>
